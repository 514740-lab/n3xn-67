    <!-- Monaco + HTML mode -->
    <script>
      (() => {
        const urlMode = document.getElementById("url-mode");
        const urlInput = document.getElementById("is");
        const editorContainer = document.getElementById("html-editor-container");
        const runButton = document.getElementById("html-run");

        let editor = null;
        let monacoReady = null;
        let switchingMode = false;

        /*
         * Load Monaco only when it is actually needed.
         * This keeps normal URL mode lightweight.
         */
        function loadMonaco() {
          if (monacoReady) return monacoReady;

          monacoReady = new Promise((resolve, reject) => {
            if (window.monaco) {
              resolve(window.monaco);
              return;
            }

            const loader = document.createElement("script");

            loader.src =
              "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js";

            loader.onload = () => {
              window.require.config({
                paths: {
                  vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"
                }
              });

              window.require(
                ["vs/editor/editor.main"],
                () => resolve(window.monaco),
                reject
              );
            };

            loader.onerror = reject;
            document.head.appendChild(loader);
          });

          return monacoReady;
        }

        async function switchToHtmlMode(initialValue = "<") {
          if (switchingMode) return;

          switchingMode = true;

          urlMode.style.display = "none";
          editorContainer.style.display = "block";

          try {
            const monaco = await loadMonaco();

            if (!editor) {
              editor = monaco.editor.create(
                document.getElementById("html-editor"),
                {
                  value: initialValue,
                  language: "html",
                  theme: "vs-dark",
                  automaticLayout: true,
                  minimap: {
                    enabled: false
                  },
                  fontSize: 14,
                  lineNumbers: "on",
                  wordWrap: "on",
                  scrollBeyondLastLine: false,
                  padding: {
                    top: 12,
                    bottom: 60
                  }
                }
              );

              editor.onDidChangeModelContent(() => {
                if (!editor) return;

                const value = editor.getValue();

                /*
                 * If the user deletes everything, go back
                 * to the normal URL/search input.
                 */
                if (value.length === 0) {
                  switchToUrlMode();
                }
              });
            } else {
              editor.setValue(initialValue);
              editor.layout();
            }

            editor.focus();
            editor.setPosition({
              lineNumber: 1,
              column: initialValue.length + 1
            });
          } catch (error) {
            console.error("Failed to load Monaco:", error);

            /*
             * Monaco failed to load. Fall back to the normal input
             * instead of leaving the search page unusable.
             */
            switchToUrlMode();

            urlInput.value = initialValue;
            urlInput.focus();
          } finally {
            switchingMode = false;
          }
        }

        function switchToUrlMode() {
          editorContainer.style.display = "none";
          urlMode.style.display = "";

          if (editor) {
            editor.setValue("");
          }

          urlInput.value = "";
          urlInput.focus();
        }

        /*
         * Typing "<" in the normal search/address field immediately
         * changes the interface into HTML mode.
         */
        urlInput.addEventListener("input", () => {
          if (switchingMode) return;

          const value = urlInput.value;

          if (value.startsWith("<")) {
            switchToHtmlMode(value);
          }
        });

        /*
         * Run HTML:
         *
         * 1. Create a Blob containing the editor HTML.
         * 2. Create its Blob URL.
         * 3. Open about:blank.
         * 4. The about:blank page fetches the first Blob URL.
         * 5. It creates a SECOND Blob from that content.
         * 6. It replaces itself with the second Blob URL.
         */
        runButton.addEventListener("click", () => {
          if (!editor) return;

          const html = editor.getValue();

          if (!html.trim()) {
            switchToUrlMode();
            return;
          }

          const firstBlob = new Blob([html], {
            type: "text/html"
          });

          const firstBlobUrl = URL.createObjectURL(firstBlob);

          const popup = window.open("about:blank", "_blank");

          if (!popup || popup.closed) {
            URL.revokeObjectURL(firstBlobUrl);
            alert("Please allow popups and redirects.");
            return;
          }

          /*
           * Serialize the Blob URL into the about:blank document.
           * The about:blank page inherits the opener's origin, so it
           * can fetch the Blob URL created above.
           */
          const safeBlobUrl = JSON.stringify(firstBlobUrl);

          popup.document.open();

          popup.document.write(`
            <!doctype html>
            <html>
              <head>
                <meta charset="UTF-8">
                <title>Loading...</title>
              </head>
              <body>
                <script>
                  (async () => {
                    const oldBlobUrl = ${safeBlobUrl};

                    try {
                      const response = await fetch(oldBlobUrl);
                      const oldBlobContent = await response.text();

                      const newBlob = new Blob(
                        [oldBlobContent],
                        { type: "text/html" }
                      );

                      const newBlobUrl = URL.createObjectURL(newBlob);

                      window.location.replace(newBlobUrl);
                    } catch (error) {
                      document.body.innerHTML =
                        "<pre>" +
                        String(error).replace(/&/g, "&amp;")
                          .replace(/</g, "&lt;")
                          .replace(/>/g, "&gt;") +
                        "</pre>";
                    }
                  })();
                <\/script>
              </body>
            </html>
          `);

          popup.document.close();

          /*
           * Give the popup a moment to obtain the original Blob before
           * revoking our local reference.
           */
          setTimeout(() => {
            URL.revokeObjectURL(firstBlobUrl);
          }, 30000);
        });
      })();
    </script>
