<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Loading...</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>

  <script src="/m/bundle.js"></script>
  <script src="/m/config.js"></script>
</head>

<body>

<script>
(async () => {
  const iframe = document.createElement('iframe')

  iframe.id = 'frame'

  /*
   * Required initial source.
   */
  iframe.src = 'xd://67'

  iframe.setAttribute(
    'allow',
    [
      'accelerometer',
      'autoplay',
      'camera',
      'clipboard-read',
      'clipboard-write',
      'display-capture',
      'encrypted-media',
      'fullscreen',
      'geolocation',
      'gyroscope',
      'microphone',
      'payment',
      'picture-in-picture',
      'speaker-selection',
      'usb',
      'web-share',
      'xr-spatial-tracking'
    ].join('; ')
  )

  iframe.setAttribute('allowfullscreen', '')
  iframe.setAttribute('webkitallowfullscreen', '')
  iframe.setAttribute('mozallowfullscreen', '')
  iframe.setAttribute('referrerpolicy', 'no-referrer')

  document.body.appendChild(iframe)

  /*
   * Get everything after /url/.
   *
   * pathname preserves slashes.
   * search preserves ?query=...
   * hash preserves #fragment.
   */
  const marker = '/url/'
  const pathname = location.pathname

  const markerIndex = pathname.indexOf(marker)

  if (markerIndex === -1) {
    document.title = 'Invalid URL'
    return
  }

  let target =
    pathname.slice(markerIndex + marker.length)

  /*
   * Query strings and fragments are not part of pathname,
   * so explicitly add them back.
   */
  if (location.search) {
    target += location.search
  }

  if (location.hash) {
    target += location.hash
  }

  /*
   * Decode URI-encoded URLs.
   *
   * decodeURIComponent is used repeatedly so something like
   * %253A can still resolve to %3A -> :.
   */
  for (let i = 0; i < 3; i++) {
    try {
      const decoded = decodeURIComponent(target)

      if (decoded === target) {
        break
      }

      target = decoded
    } catch {
      break
    }
  }

  target = target.trim()

  if (!target) {
    document.title = 'No URL specified'
    return
  }

  /*
   * Allow:
   *
   * google.com
   * www.google.com
   * https://google.com
   * http://google.com/path
   */
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(target)) {
    target = 'https://' + target
  }

  try {
    const targetURL = new URL(target)

    if (
      targetURL.protocol !== 'http:' &&
      targetURL.protocol !== 'https:'
    ) {
      throw new Error('Only HTTP and HTTPS URLs are supported.')
    }

    /*
     * Make sure the UV configuration actually loaded.
     */
    if (
      typeof __uv$config === 'undefined' ||
      typeof __uv$config.encodeUrl !== 'function'
    ) {
      throw new Error(
        'Ultraviolet configuration failed to load.'
      )
    }

    /*
     * Register the UV service worker using the project's
     * existing /m/sw.js file.
     */
    await navigator.serviceWorker.register(
      __uv$config.sw,
      {
        scope: __uv$config.prefix
      }
    )

    /*
     * Construct the normal UV /a/ URL.
     */
    const proxied =
      __uv$config.prefix +
      __uv$config.encodeUrl(targetURL.toString())

    /*
     * The custom xd://67 document cannot reliably be modified
     * from this HTTPS page because of browser same-origin rules.
     *
     * Keep the required iframe source initially, then navigate
     * the iframe to the actual UV URL once it is ready.
     */
    iframe.src = proxied

    document.title = targetURL.hostname
  } catch (error) {
    document.body.innerHTML = ''

    const message = document.createElement('pre')

    message.style.cssText = `
      box-sizing: border-box;
      margin: 0;
      padding: 20px;
      width: 100%;
      height: 100%;
      overflow: auto;
      color: white;
      background: #000;
      font-family: monospace;
      white-space: pre-wrap;
    `

    message.textContent =
      'Unable to open URL: ' +
      (error?.message || String(error))

    document.body.appendChild(message)
  }
})()
</script>

</body>
</html>
